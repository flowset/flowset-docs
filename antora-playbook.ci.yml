site:
  title: Flowset Documentation
  start_page: flowset:ROOT:intro.adoc
  url: https://docs.flowset.io/
content:
  sources:
  - url: https://github.com/flowset/flowset-docs.git
    branches:
      - release_2026.0
      - release_2025.0
    start_path: content
  # Spanish docs (flowset-es). Only built for versions that actually contain content-es/.
  # content-es/ exists on release_2026.0; older branches (release_2025.0) do not have it,
  # so listing them here would fail the build with "the start path 'content-es' does not exist".
  - url: https://github.com/flowset/flowset-docs.git
    branches:
      - release_2026.0
    start_path: content-es
ui:
  bundle:
    # Phase 1: production builds use the published Flowset UI bundle.
    # url: https://github.com/flowset/flowset-ui/releases/latest/download/ui-bundle.zip
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/master/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./content/supplemental
antora:
  extensions:
    # Builds the full-text search index during the build (runs in CI too).
    - ./search-index-extension.js
asciidoc:
  extensions:
    - asciidoctor-kroki
    # Enable tabbed content after `npm install` (adds @asciidoctor/tabs):
    # - '@asciidoctor/tabs'
